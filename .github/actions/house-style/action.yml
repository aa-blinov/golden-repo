name: House style
description: Check this repository against the house standard.

# The standard is a dependency, not a copy. A repository that adopts it
# uses this action at a pinned version, and Dependabot opens the pull
# request that bumps the pin. The action ships the checker at exactly the
# version it was tagged with, so "the standard version" and "the checker"
# can never drift apart.

inputs:
  path:
    description: The repository path to check, relative to the workspace.
    required: false
    default: "."
  strict:
    description: Treat soft findings as failures.
    required: false
    default: "true"
  report:
    description: Write the findings as JSON to this file.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the repository against the standard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET: ${{ inputs.path }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        if [ "$STRICT" = "true" ]; then
          python3 "$ACTION_PATH/scripts/housecheck.py" --strict "$TARGET"
        else
          python3 "$ACTION_PATH/scripts/housecheck.py" "$TARGET"
        fi

    - name: Write the findings as JSON
      if: always() && inputs.report != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET: ${{ inputs.path }}
        REPORT: ${{ inputs.report }}
      run: |
        python3 "$ACTION_PATH/scripts/housecheck.py" --json "$TARGET" > "$REPORT" || true

    - name: Show the findings
      if: always() && inputs.report != ''
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: cat "$REPORT" || true
