name: ci

# The generic CI shape every repository that adopts the standard carries.
# Replace the build and test steps with the ones your stack actually needs —
# but keep the structure: install, check, test, and a build that proves the
# artefact is produced.
#
# The house-style check lives in its own workflow (house-style.yml) so that a
# failure of the standard is visibly different from a failure of the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace this block with the stack's toolchain. The standard does not
      # dictate a language, only that the steps exist and that CI is the
      # place the code's own checks run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          # pip install -e '.[dev]'

      - name: Test
        # run: python3 -m pytest -q
        run: echo "Replace with the test command for this stack."

      - name: Build
        # run: python3 -m build
        run: echo "Replace with the build command for this stack."
