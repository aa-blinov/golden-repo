name: adopt

# Open a pull request that brings a repository to the house standard.
#
# The migration is mechanical: it adds the files every repository in this
# collection carries and touches nothing that already exists. That is why it
# travels as a pull request. A mechanical change is worth reading as a diff,
# and the first one to be read carefully is the proof that the other
# seventy-nine are the same diff.
#
# The list comes from adoption-targets.json, which the audit writes. The
# order is by how much a repository is looked at: the starred ones first,
# because they are the ones a visitor lands on.
#
# The token needs write access to the target repositories. Store a personal
# access token with the `repo` scope as the GH_TOKEN secret of this
# repository.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to work through.
        required: false
        default: "tier1"
        type: choice
        options: [tier1, tier2, tier3]
      repository:
        description: A single repository, instead of a tier.
        required: false
        default: ""
  schedule:
    # Weekly, so that a repository added to the collection is picked up
    # without anyone remembering to run this.
    - cron: "43 7 * * 2"

permissions:
  contents: read

jobs:
  adopt:
    name: Adopt ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      # One repository that fails must not stop the others.
      fail-fast: false
      max-parallel: 4
      matrix:
        repository: ${{ fromJson(needs.targets.outputs.repositories) }}
    needs: targets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 scripts/adopt_bot.py "${{ matrix.repository }}"

  targets:
    name: Work out the list
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.pick.outputs.repositories }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        env:
          TIER: ${{ inputs.tier }}
          SINGLE: ${{ inputs.repository }}
        run: |
          if [ -n "$SINGLE" ]; then
            echo "repositories=[\"$SINGLE\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIER="${TIER:-tier1}"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          with open("adoption-targets.json") as handle:
              targets = json.load(handle)
          tier = os.environ.get("TIER", "tier1")
          names = targets.get(tier, [])
          print("repositories=%s" % json.dumps(names))
          PY
