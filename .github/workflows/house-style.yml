name: house style

# The standard enforced against itself. A rule that the golden repository
# cannot satisfy is a rule that is wrong, so this workflow is the earliest
# signal that a change to the standard needs rethinking.
#
# It runs the same composite action that every adopting repository uses, so
# the standard is checked by the mechanism it ships.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  housecheck:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/house-style
        with:
          report: house-style.json

      - name: Unit tests for the checker
        run: python3 -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: house-style-report
          path: house-style.json
